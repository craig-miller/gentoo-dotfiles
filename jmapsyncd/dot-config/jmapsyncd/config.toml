# Fastmail JMAP accounts synchronized into daemon-owned account stores.
# Authentication remains in pass; no tokens are stored here.

data_root = "~/.local/share/connectr"

[[accounts]]
name = "personal"
enabled = true
jmap_host = "api.fastmail.com"
jmap_user = "craig@craigmiller.io"
jmap_token_cmd = "pass show api/fastmail/craig@craigmiller.io/jmap-token"
timeout_secs = 30
poll_interval_secs = 300

# Enabled for manual Phase 8 acceptance at the user's request.
[[accounts]]
name = "nextidea"
enabled = true
jmap_host = "api.fastmail.com"
jmap_user = "craig@nextidea.io"
jmap_token_cmd = "pass show api/fastmail/craig@nextidea.io/jmap-token"
timeout_secs = 30
poll_interval_secs = 300
