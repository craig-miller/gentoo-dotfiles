config_version = 14

[brightness]
enable_ddcutil = true
minimum_brightness = 0.23999999463558197

[calendar]
enabled = true
refresh_minutes = 5

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1536.0
    cy = 1546.0
    output = "HDMI-A-1"
    placement_height = 1728.0
    placement_width = 3072.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 864.0
    cy = 935.0
    output = "eDP-1"
    placement_height = 1117.0
    placement_width = 1728.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/wallhaven" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/craig-miller/zentoo-noctalia-plugins"
    name = "zentoo-release"

    [[plugins.source]]
    kind = "path"
    location = "~/src/zentoo-noctalia-plugins"
    name = "zentoo-dev"

[shell.launcher]
categories = false
compact = true
show_app_actions = true
show_icons = false

[theme]
builtin = "Nord"
mode = "dark"
source = "builtin"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "niri", "starship" ]
    community_ids = [ "pi-agent", "neovim", "fastfetch", "zathura", "bat", "fzf", "yazi" ]

[wallpaper]
directory = "/home/craig/pics/wallpaper"

    [wallpaper.default]
    path = "/home/craig/pics/wallpaper/wallhaven-vpep35.png"

    [wallpaper.last]
    path = "/home/craig/pics/wallpaper/wallhaven-vpep35.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/craig/pics/wallpaper/wallhaven-vpep35.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/craig/pics/wallpaper/wallhaven-vpep35.png"

[widget.clock]
font_weight = 700