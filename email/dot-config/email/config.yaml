# User config for Email. Managed by ~/dotfiles/email.

profiles:
  active: fastmail
  ids:
    - fastmail
    - nextidea

  fastmail:
    displayName: craigmiller.io
    emailAccounts:
      - personal
    contactSources:
      - fastmail
    calendarSources:
      - fastmail-primary
      - fastmail-holidays
    taskSources:
      - fastmail-task-lists
    defaults:
      emailAccount: personal
      calendarSource: fastmail-primary
      taskSource: fastmail-task-lists

  nextidea:
    displayName: nextidea.io
    emailAccounts:
      - nextidea
    contactSources:
      - fastmail-nextidea-personal
      - fastmail-nextidea-global
    calendarSources:
      - fastmail-nextidea-work
      - fastmail-nextidea-craig
    taskSources:
      - fastmail-nextidea-task-lists
    defaults:
      emailAccount: nextidea
      calendarSource: fastmail-nextidea-work
      taskSource: fastmail-nextidea-task-lists

contacts:
  sources:
    icloud:
      kind: vcardDirectory
      displayName: iCloud
      path: ~/.local/share/vdir/icloud/contacts/card
      photoAuthentication:
        kind: httpBasic
        usernameCommand: /usr/bin/pass show api/icloud/caldav/username
        passwordCommand: /usr/bin/pass show api/icloud/caldav/app-password
        allowedHosts:
          - gateway.icloud.com
    fastmail:
      kind: vcardDirectory
      displayName: Fastmail
      path: ~/.local/share/vdir/fastmail/contacts/Default
    fastmail-nextidea-personal:
      kind: vcardDirectory
      displayName: Personal
      path: ~/.local/share/vdir/fastmail-nextidea/contacts/Default
    fastmail-nextidea-global:
      kind: vcardDirectory
      displayName: Global Address Book
      path: ~/.local/share/vdir/fastmail-nextidea/contacts/masteruser_autos7y5yx8@fastmail.com.Shared

calendars:
  sources:
    fastmail-primary:
      kind: icalendarDirectory
      displayName: Fastmail
      path: ~/.local/share/vdir/fastmail/calendars/134B7FA0-45C1-11F1-BC43-106590036B07
      access: readOnly
    fastmail-holidays:
      kind: icalendarDirectory
      displayName: Holidays
      path: ~/.local/share/vdir/fastmail/calendars/9E0D7ACC-466A-11F1-8F33-4C429B0D7FC7
      access: readOnly
    fastmail-nextidea-work:
      kind: icalendarDirectory
      displayName: Work
      path: ~/.local/share/vdir/fastmail-nextidea/caldav/C695076C-B96A-11F1-B564-A06D75F6E690
      access: readOnly
    fastmail-nextidea-craig:
      kind: icalendarDirectory
      displayName: Craig Miller
      path: ~/.local/share/vdir/fastmail-nextidea/caldav/16d45c08-eb77-4073-b855-e2ce108628ca
      access: readOnly

tasks:
  sources:
    fastmail-task-lists:
      kind: icalendarCollectionDirectory
      displayName: Fastmail Task Lists
      path: ~/.local/share/vdir/fastmail/tasks
      collectionsFile: ~/.local/state/vdirsyncer/status/fastmail_tasks.collections
      sourceIDPrefix: fastmail-
      inboxCollection: tasks
      excludedCollections:
        - 134B7FA0-45C1-11F1-BC43-106590036B07
        - 9E0D7ACC-466A-11F1-8F33-4C429B0D7FC7
      access: readWrite
    fastmail-nextidea-task-lists:
      kind: icalendarCollectionDirectory
      displayName: nextidea.io Task Lists
      path: ~/.local/share/vdir/fastmail-nextidea/caldav
      collectionsFile: ~/.local/state/vdirsyncer/status/fastmail_nextidea_caldav.collections
      sourceIDPrefix: fastmail-nextidea-
      inboxCollection: 51DC7576-39DE-4ECA-8A79-EAF9A96762D3
      excludedCollections:
        - 0713b9ad-e4b9-47d2-bae1-3508294c2dff
        - 16d45c08-eb77-4073-b855-e2ce108628ca
        - C695076C-B96A-11F1-B564-A06D75F6E690
      access: readWrite

email:
  jmap:
    dataRoot: /home/craig/.local/share/connectr
    controlSocketPath: /run/user/1000/connectr-mail-control-v2.sock
    transferSocketPath: /run/user/1000/connectr-mail-transfer.sock
    timeoutMilliseconds: 30000

  pageSize: 200
  overscan: 100

  keybindings:
    normal:
      previous_message:
        - k
        - up
      next_message:
        - j
        - down
      first_message:
        - gg
      last_message:
        - shift-g
      open:
        - return
      close:
        - escape
      archive_message:
        - e
      trash_message:
        - dd
      spam_message:
        - "!"
      reply_message:
        - r
      forward_message:
        - f
      unsubscribe_message:
        - shift-u
      folder_select:
        - ctrl-f
      move_message:
        - m
      toggle_read:
        - u

  accounts:
    personal:
      displayName: craigmiller.io
      permanentDestroyPolicy: confirmedTrashOnly
      identity:
        name: Craig Miller
        address: craig@craigmiller.io

    nextidea:
      displayName: nextidea.io
      identity:
        name: Craig Miller
        address: craig@nextidea.io

