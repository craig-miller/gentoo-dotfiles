# Fastmail JMAP accounts synchronized into distinct Maildir trees.
# Authentication remains in pass; no tokens are stored here.

db_dir = "~/.local/share/jmapsyncd"

[[accounts]]
name = "personal"
enabled = true
jmap_host = "api.fastmail.com"
jmap_user = "craig@craigmiller.io"
jmap_token_cmd = "pass show api/fastmail/craig@craigmiller.io/jmap-token"
timeout_secs = 30
poll_interval_secs = 300

[accounts.mail]
path = "~/mail/fastmail"
sync_mode = "mirror"
subscribed_only = false
index_refresh_hook = "notmuch new"

[accounts.submit]
from_address = "craig@craigmiller.io"

[[accounts]]
name = "nextidea"
enabled = true
jmap_host = "api.fastmail.com"
jmap_user = "craig@nextidea.io"
jmap_token_cmd = "pass show api/fastmail/craig@nextidea.io/jmap-token"
timeout_secs = 30
poll_interval_secs = 300

[accounts.mail]
path = "~/mail/fastmail-nextidea"
sync_mode = "mirror"
subscribed_only = false
index_refresh_hook = "notmuch new"

[accounts.submit]
from_address = "craig@nextidea.io"
